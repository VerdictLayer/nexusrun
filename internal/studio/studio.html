<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexusRun Studio</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #fbfbfd; --panel: #fff; --text: #14161a; --muted: #666e7a; --line: #e3e6ea;
    --accent: #2f6df6; --ok: #17864a; --warn: #b06000; --bad: #c8352b; --grid: #eceef2;
    --node: #fff; --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1013; --panel: #16191e; --text: #e7eaee; --muted: #9aa3ae; --line: #262b33;
      --accent: #6f9bff; --ok: #4ec27f; --warn: #e0a250; --bad: #ff7b72; --grid: #1a1e24; --node: #1b1f26;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #app { display: grid; height: 100%; grid-template-rows: 48px 1fr auto; grid-template-columns: 290px 1fr 320px; grid-template-areas: "top top top" "models stage inspector" "problems problems problems"; }
  header { grid-area: top; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; letter-spacing: -0.01em; }
  header .dir { color: var(--muted); font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .btn { font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--bad); }
  .btn:disabled { opacity: .5; cursor: default; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  aside { background: var(--panel); overflow-y: auto; padding: 14px; }
  #models { grid-area: models; border-right: 1px solid var(--line); }
  #inspector { grid-area: inspector; border-left: 1px solid var(--line); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  h3 { font-size: 15px; margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .mono { font-family: var(--mono); font-size: 12px; }
  input[type=text], input[type=number], textarea, select { width: 100%; font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--text); }
  textarea { resize: vertical; min-height: 90px; font-family: var(--mono); font-size: 12px; }
  label { display: block; font-size: 12px; font-weight: 600; margin: 12px 0 4px; color: var(--muted); }
  label.inline { display: flex; align-items: center; gap: 6px; margin: 4px 12px 4px 0; font-weight: 400; color: var(--text); }
  label.inline input { width: auto; }
  .row { display: flex; flex-wrap: wrap; align-items: center; }
  .model { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; margin: 0 0 8px; cursor: grab; background: var(--bg); user-select: none; touch-action: none; }
  .model:hover { border-color: var(--accent); }
  .model.err { opacity: .55; cursor: default; }
  .model .name { font-weight: 600; font-size: 13px; word-break: break-all; }
  .model .meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .hw { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  #stage { grid-area: stage; position: relative; overflow: hidden; background-color: var(--bg); background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 22px 22px; }
  #svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #svg.panning { cursor: grabbing; }
  .node rect.box { fill: var(--node); stroke: var(--line); stroke-width: 1.5; }
  .node:hover rect.box { stroke: var(--accent); }
  .node.sel rect.box { stroke: var(--accent); stroke-width: 2.5; }
  .node.bad rect.box { stroke: var(--bad); stroke-width: 2.5; }
  .node text { fill: var(--text); pointer-events: none; font-family: system-ui, sans-serif; }
  .node .title { font-size: 14px; font-weight: 700; }
  .node .sub { font-size: 11px; fill: var(--muted); font-family: var(--mono); }
  .node .chip { font-size: 11px; }
  .node .chip.warn { fill: var(--warn); }
  .node .chip.ok { fill: var(--ok); }
  .port { fill: var(--panel); stroke: var(--accent); stroke-width: 2; cursor: crosshair; }
  .port:hover { fill: var(--accent); }
  .edge { fill: none; stroke: var(--muted); stroke-width: 2; }
  .edge.sel { stroke: var(--accent); stroke-width: 3; }
  .edge.bad { stroke: var(--bad); stroke-width: 3; }
  .edgehit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }
  .edgelabel { font-size: 11px; fill: var(--muted); font-family: var(--mono); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; pointer-events: none; }
  #tmp { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 6 4; pointer-events: none; }
  #hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; text-align: center; color: var(--muted); padding: 40px; }
  #hint div { max-width: 380px; }
  #problems { grid-area: problems; border-top: 1px solid var(--line); background: var(--panel); max-height: 150px; overflow-y: auto; padding: 8px 16px; }
  #problems .item { display: flex; gap: 10px; padding: 3px 0; cursor: pointer; font-size: 13px; }
  #problems .item:hover { color: var(--accent); }
  #problems .path { font-family: var(--mono); font-size: 12px; color: var(--bad); white-space: nowrap; }
  #yaml { position: absolute; right: 12px; top: 12px; bottom: 12px; width: min(520px, 80%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow: auto; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
  #yaml pre { margin: 0; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; }
  #ghost { position: fixed; z-index: 10; pointer-events: none; padding: 6px 10px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; opacity: .92; }
  #banner { position: absolute; top: 0; left: 0; right: 0; z-index: 2; background: color-mix(in srgb, var(--warn) 14%, var(--panel)); border-bottom: 1px solid var(--line); padding: 8px 16px; font-size: 13px; }
  .grow { flex: 1; }
  #arrow path { fill: var(--muted); }
  [hidden] { display: none !important; }
  @media (max-width: 900px) { #app { grid-template-columns: 220px 1fr 260px; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>NexusRun Studio</h1>
    <span class="dir" id="dir"></span>
    <span class="pill" id="health">…</span>
    <span class="small muted" id="save"></span>
    <button class="btn" id="addAgent" type="button" title="Drag onto the canvas, or click to add at the centre">＋ Agent</button>
    <button class="btn" id="fit" type="button">Fit</button>
    <button class="btn" id="showYaml" type="button">YAML</button>
  </header>
  <aside id="models"></aside>
  <main id="stage">
    <svg id="svg" role="application" aria-label="Workflow canvas">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
      </defs>
      <g id="vp"><g id="edges"></g><g id="nodes"></g><path id="tmp" d=""></path></g>
    </svg>
    <div id="hint"><div><b>Build a workflow</b><br>Drag <b>＋ Agent</b> onto the canvas. Drag a model from the left onto an agent. Drag from an agent's right dot to another agent to send its output there.</div></div>
    <div id="yaml" hidden><div class="row"><b class="grow">nexus-compose.yaml</b><button class="btn" id="copyYaml" type="button">Copy</button></div><pre id="yamlText"></pre></div>
  </main>
  <aside id="inspector"></aside>
  <section id="problems"></section>
</div>
<div id="ghost" hidden></div>

<script>
"use strict";
// Everything that comes from disk (model names, unit references, YAML) is put on
// the page with textContent only, never as markup.
const token = (() => {
  const m = /[#&]token=([0-9a-f]+)/.exec(location.hash);
  try {
    if (m) { sessionStorage.setItem("studio-token", m[1]); history.replaceState(null, "", location.pathname); }
    return sessionStorage.getItem("studio-token") || "";
  } catch { return m ? m[1] : ""; }
})();

async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: Object.assign({ Authorization: "Bearer " + token }, body !== undefined ? { "Content-Type": "application/json" } : {}),
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await r.json(); } catch { /* empty body */ }
  if (r.status === 401) throw new Error("Open the link that `nexus studio` printed; it carries the access token.");
  if (!r.ok) throw new Error(data.error || "HTTP " + r.status);
  return data;
}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") Object.assign(el.style, v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "spellcheck") el.setAttribute(k, v);
    else if (k in el && k !== "list") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const SVGNS = "http://www.w3.org/2000/svg";
function s(tag, attrs, text) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  if (text !== undefined) el.textContent = text;
  return el;
}
const $ = (id) => document.getElementById(id);
const clip = (str, n) => { str = String(str ?? ""); return str.length > n ? str.slice(0, n - 1) + "…" : str; };

// ---------- state ----------
const NAME_RE = /^[a-zA-Z_][a-zA-Z0-9_]*$/;
const W = 230, H = 104;
const S = {
  spec: null, layout: {}, models: [], hw: null, dirs: [], fixedDirs: [], sel: null,
  diags: [], units: {}, view: { x: 40, y: 40, k: 1 }, yaml: "", broken: false, project: null,
};

function ownDir(agent) {
  const m = /^\.\/agents\/([a-zA-Z_][a-zA-Z0-9_]*)$/.exec(S.spec.agents[agent]?.unit || "");
  return m ? m[1] : null;
}

// ---------- saving ----------
let seq = 0, timer = null;
function changed() {
  if (S.broken) return;
  $("save").textContent = "Unsaved…";
  clearTimeout(timer);
  timer = setTimeout(commit, 450);
}
async function commit() {
  const mine = ++seq;
  try {
    const rep = await api("POST", "/api/render", { spec: S.spec });
    if (mine !== seq) return;
    S.diags = rep.diagnostics; S.yaml = rep.yaml;
    await api("PUT", "/api/workflow", { yaml: rep.yaml });
    if (mine !== seq) return;
    $("save").textContent = "Saved";
  } catch (e) { $("save").textContent = "Not saved: " + e.message; }
  renderProblems(); decorate(); renderYaml();
}
let layoutTimer = null;
function layoutChanged() {
  clearTimeout(layoutTimer);
  layoutTimer = setTimeout(() => api("PUT", "/api/layout", S.layout).catch(() => {}), 600);
}

// ---------- layout ----------
function levels() {
  const lv = {}, names = Object.keys(S.spec.agents);
  const preds = {};
  names.forEach((n) => (preds[n] = new Set(S.spec.agents[n].depends_on || [])));
  S.spec.routing.forEach((r) => preds[r.to]?.add(r.from));
  const visit = (n, seen) => {
    if (lv[n] !== undefined) return lv[n];
    if (seen.has(n)) return 0;
    seen.add(n);
    let best = 0;
    for (const p of preds[n] || []) if (p in preds) best = Math.max(best, visit(p, seen) + 1);
    return (lv[n] = best);
  };
  names.forEach((n) => visit(n, new Set()));
  return lv;
}
function autoPlace() {
  const lv = levels(), rows = {};
  for (const n of Object.keys(S.spec.agents)) {
    if (S.layout[n]) continue;
    const c = lv[n] || 0;
    rows[c] = (rows[c] ?? Object.keys(S.layout).filter((k) => S.spec.agents[k] && (lv[k] || 0) === c).length);
    S.layout[n] = { x: 60 + c * 320, y: 60 + rows[c] * 150 };
    rows[c]++;
  }
}

// ---------- drawing ----------
function nodeRect(n) { const p = S.layout[n]; return { x: p.x, y: p.y, w: W, h: H }; }
function outPt(n) { const r = nodeRect(n); return { x: r.x + W, y: r.y + H / 2 }; }
function inPt(n) { const r = nodeRect(n); return { x: r.x, y: r.y + H / 2 }; }
function curve(a, b) {
  const dx = Math.max(60, Math.abs(b.x - a.x) / 2);
  return `M${a.x},${a.y} C${a.x + dx},${a.y} ${b.x - dx},${b.y} ${b.x},${b.y}`;
}

function modelLabel(name) {
  const a = S.spec.agents[name], dir = ownDir(name), u = dir ? S.units[dir] : null;
  if (a.model) return { text: "model: " + clip(a.model, 26), cls: "ok" };
  if (u && u.editable) return u.model ? { text: "model: " + clip(u.model, 26), cls: "ok" } : { text: "no model chosen", cls: "warn" };
  return { text: "model: from its unit", cls: "" };
}
function promptLabel(name) {
  const dir = ownDir(name), u = dir ? S.units[dir] : null;
  if (!u || !u.editable) return null;
  return u.prompt ? { text: "prompt: " + u.prompt.length + " chars", cls: "ok" } : { text: "no prompt yet", cls: "warn" };
}

function draw() {
  $("vp").setAttribute("transform", `translate(${S.view.x},${S.view.y}) scale(${S.view.k})`);
  const nodes = $("nodes"), edges = $("edges");
  nodes.replaceChildren(); edges.replaceChildren();
  S.spec.routing.forEach((r, i) => {
    if (!S.layout[r.from] || !S.layout[r.to]) return;
    const a = outPt(r.from), b = inPt(r.to), d = curve(a, b);
    const g = s("g", { "data-edge": i });
    g.append(s("path", { class: "edge", d, "marker-end": "url(#arrow)" }), s("path", { class: "edgehit", d }));
    const label = r.condition && r.condition !== "always" ? r.condition : "";
    if (label || r.transform) g.append(s("text", { class: "edgelabel", x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 - 8, "text-anchor": "middle" }, clip((label || "transform") + (label && r.transform ? "  ⟶ transform" : ""), 34)));
    edges.append(g);
  });
  for (const name of Object.keys(S.spec.agents)) {
    const p = S.layout[name], a = S.spec.agents[name];
    const g = s("g", { class: "node", "data-agent": name, transform: `translate(${p.x},${p.y})` });
    g.append(s("rect", { class: "box", width: W, height: H, rx: 11 }));
    g.append(s("text", { class: "title", x: 16, y: 26 }, clip(name, 24)));
    g.append(s("text", { class: "sub", x: 16, y: 44 }, clip(a.unit || "no unit yet", 32)));
    const m = modelLabel(name), pr = promptLabel(name);
    g.append(s("text", { class: "chip " + m.cls, x: 16, y: 68 }, m.text));
    if (pr) g.append(s("text", { class: "chip " + pr.cls, x: 16, y: 88 }, pr.text));
    g.append(s("circle", { class: "port", "data-port": "in", cx: 0, cy: H / 2, r: 7 }), s("circle", { class: "port", "data-port": "out", cx: W, cy: H / 2, r: 7 }));
    nodes.append(g);
  }
  decorate();
  $("hint").hidden = Object.keys(S.spec.agents).length > 0;
}

function decorate() {
  const bad = new Set(), badEdges = new Set();
  for (const d of S.diags) {
    const e = /^routing\[(\d+)\]/.exec(d.path);
    if (e) badEdges.add(+e[1]);
    for (const n of d.agents || []) bad.add(n);
    const a = /^agents\.([^.]+)/.exec(d.path);
    if (a) bad.add(a[1]);
    if (d.path === "agents" && d.agents) S.spec.routing.forEach((r, i) => { if (d.agents.includes(r.from) && d.agents.includes(r.to)) badEdges.add(i); });
  }
  document.querySelectorAll(".node").forEach((el) => {
    const n = el.dataset.agent;
    el.classList.toggle("bad", bad.has(n));
    el.classList.toggle("sel", S.sel?.kind === "agent" && S.sel.name === n);
  });
  document.querySelectorAll("#edges g").forEach((el) => {
    const i = +el.dataset.edge, p = el.querySelector(".edge");
    p.classList.toggle("bad", badEdges.has(i));
    p.classList.toggle("sel", S.sel?.kind === "edge" && S.sel.i === i);
  });
  const n = S.diags.length;
  const pill = $("health");
  pill.textContent = S.broken ? "can't read file" : n === 0 ? (Object.keys(S.spec?.agents || {}).length ? "valid" : "empty") : n + " problem" + (n === 1 ? "" : "s");
  pill.className = "pill " + (S.broken || n ? "bad" : Object.keys(S.spec?.agents || {}).length ? "ok" : "");
}

function renderProblems() {
  const box = $("problems");
  box.replaceChildren();
  box.hidden = S.diags.length === 0;
  for (const d of S.diags) {
    const where = d.path || (d.line ? "line " + d.line : "file");
    box.append(h("div", { class: "item", onclick: () => focusDiag(d) }, h("span", { class: "path" }, where), h("span", {}, d.message)));
  }
}
function focusDiag(d) {
  const e = /^routing\[(\d+)\]/.exec(d.path);
  if (e) return select({ kind: "edge", i: +e[1] });
  const a = /^agents\.([^.]+)/.exec(d.path) || (d.agents?.[0] && [null, d.agents[0]]);
  if (a && S.spec.agents[a[1]]) return select({ kind: "agent", name: a[1] });
  select(null);
}
function renderYaml() { $("yamlText").textContent = S.yaml; }

// ---------- selection and inspector ----------
function select(sel) { S.sel = sel; decorate(); inspect(); }

function field(label, input, hint) {
  const out = [h("label", {}, label), input];
  if (hint) out.push(h("div", { class: "small muted" }, hint));
  return out;
}
function textInput(value, onInput, attrs) {
  const el = h("input", Object.assign({ type: "text", value: value ?? "", spellcheck: "false" }, attrs));
  el.addEventListener("input", () => onInput(el.value));
  return el;
}

let unitTimer = null;
function saveUnit(dir, patch) {
  clearTimeout(unitTimer);
  $("save").textContent = "Unsaved…";
  unitTimer = setTimeout(async () => {
    try { S.units[dir] = await api("PUT", "/api/unit?agent=" + encodeURIComponent(dir), patch); $("save").textContent = "Saved"; draw(); }
    catch (e) { $("save").textContent = "Not saved: " + e.message; }
  }, 500);
}

async function loadUnit(dir) {
  try { S.units[dir] = await api("GET", "/api/unit?agent=" + encodeURIComponent(dir)); } catch { /* shown as a unit with no details */ }
}

function inspect() {
  const box = $("inspector");
  box.replaceChildren();
  if (!S.spec) return;
  if (S.sel?.kind === "agent" && S.spec.agents[S.sel.name]) return inspectAgent(box, S.sel.name);
  if (S.sel?.kind === "edge" && S.spec.routing[S.sel.i]) return inspectEdge(box, S.sel.i);
  inspectWorkflow(box);
}

function inspectWorkflow(box) {
  const sp = S.spec;
  box.append(h("h2", {}, "Workflow"), h("h3", {}, sp.name || "untitled"));
  box.append(...field("Name", textInput(sp.name, (v) => { sp.name = v; changed(); }), "lowercase letters, digits and hyphens"));
  box.append(...field("Version", textInput(sp.version, (v) => { sp.version = v; changed(); })));
  box.append(...field("Description", textInput(sp.description || "", (v) => { sp.description = v || undefined; changed(); })));
  const backend = h("select", {}, ["memory", "file"].map((v) => h("option", { value: v, selected: (sp.shared_state?.backend || "memory") === v }, v)));
  backend.addEventListener("change", () => {
    sp.shared_state = sp.shared_state || {};
    sp.shared_state.backend = backend.value === "memory" ? undefined : backend.value;
    if (backend.value === "memory") { delete sp.shared_state.path; delete sp.shared_state.encryption; }
    changed(); inspect();
  });
  box.append(...field("Message bus", backend, "memory is gone when the run ends; file keeps a log you can read back"));
  if (sp.shared_state?.backend === "file") {
    box.append(h("label", { class: "inline" }, h("input", { type: "checkbox", checked: sp.shared_state.encryption === "aes256-gcm", onchange: (e) => { sp.shared_state.encryption = e.target.checked ? "aes256-gcm" : undefined; changed(); } }), "Encrypt the log (needs NEXUS_STATE_KEY)"));
  }
  const iso = h("select", {}, ["process", "namespace", "none"].map((v) => h("option", { value: v, selected: (sp.network?.isolation || "process") === v }, v)));
  iso.addEventListener("change", () => { sp.network = sp.network || {}; sp.network.isolation = iso.value === "process" ? undefined : iso.value; changed(); });
  box.append(...field("Network isolation", iso));
  box.append(h("p", { class: "small muted", style: { marginTop: "18px" } }, "Select an agent or a link to edit it. Press Delete to remove the selection."));
  if (S.project?.has_comments) box.append(h("p", { class: "small muted" }, "This file had comments. Studio rewrites the file without them and keeps your original as nexus-compose.yaml.bak."));
}

function inspectAgent(box, name) {
  const a = S.spec.agents[name], dir = ownDir(name);
  box.append(h("h2", {}, "Agent"));
  const nameInput = textInput(name, () => {}, {});
  nameInput.addEventListener("change", () => renameAgent(name, nameInput.value.trim()));
  box.append(...field("Name", nameInput, "letters, digits and underscores; used in conditions as " + name + ".output"));

  if (dir) {
    const u = S.units[dir];
    if (!u) { box.append(h("p", { class: "muted small" }, "Loading its unit…")); loadUnit(dir).then(() => { draw(); inspect(); }); }
    else if (!u.editable) {
      box.append(h("p", { class: "small muted" }, u.reason || "Studio cannot edit this unit."));
    } else {
      const ta = h("textarea", { rows: 6, spellcheck: "false", placeholder: "You are… Tell the model how to behave." });
      ta.value = u.prompt || "";
      ta.addEventListener("input", () => { u.prompt = ta.value; saveUnit(dir, { prompt: ta.value }); });
      box.append(...field("Prompt", ta, "the model's instructions; saved in " + a.unit + "/nexus.yaml"));
      const mi = textInput(u.model || "", (v) => { u.model = v; if (v.trim()) saveUnit(dir, { model: v.trim() }); }, { placeholder: "drag a model here, or type ollama:name:tag" });
      box.append(...field("Model", mi, a.model ? "overridden below by this workflow" : "drag a model from the left onto the agent"));
      const ctx = h("input", { type: "number", min: 0, step: 256, value: u.context || "" });
      ctx.addEventListener("input", () => { u.context = +ctx.value || 0; saveUnit(dir, { context: +ctx.value || 0 }); });
      box.append(...field("Context window (tokens)", ctx));
    }
  }
  box.append(...field(dir ? "Unit" : "Unit reference", textInput(a.unit, (v) => { a.unit = v; changed(); draw(); }), dir ? "this agent's own unit; change it to use a different one" : "name:version, a registry reference, or a folder"));
  if (!dir) {
    box.append(h("div", { style: { marginTop: "8px" } }, h("button", { class: "btn", type: "button", onclick: () => createOwnUnit(name) }, "Create a chat unit for this agent")));
    box.append(...field("Model override", textInput(a.model || "", (v) => { a.model = v.trim() || undefined; changed(); draw(); }, { placeholder: "use the unit's own model" }), "swaps the model for this workflow only"));
  }

  const prefer = new Set(a.hardware?.prefer || []);
  const row = h("div", { class: "row" }, ["gpu", "cpu", "npu"].map((d) => h("label", { class: "inline" }, h("input", { type: "checkbox", checked: prefer.has(d), onchange: (e) => {
    e.target.checked ? prefer.add(d) : prefer.delete(d);
    a.hardware = prefer.size ? { prefer: ["npu", "gpu", "cpu"].filter((x) => prefer.has(x)) } : undefined;
    changed();
  } }), d.toUpperCase())));
  box.append(h("label", {}, "Run on"), row, h("div", { class: "small muted" }, "none ticked: the unit's own preference"));

  const mt = h("input", { type: "number", min: 0, value: a.max_tokens || "" });
  mt.addEventListener("input", () => { a.max_tokens = +mt.value || undefined; changed(); });
  box.append(...field("Max tokens", mt));
  const rs = h("input", { type: "number", min: 0, value: a.restart || "" });
  rs.addEventListener("input", () => { a.restart = +rs.value || undefined; changed(); });
  box.append(...field("Retries after a crash", rs));
  box.append(h("div", { style: { marginTop: "18px" } }, h("button", { class: "btn danger", type: "button", onclick: () => deleteAgent(name) }, "Delete agent")));
}

function inspectEdge(box, i) {
  const r = S.spec.routing[i];
  box.append(h("h2", {}, "Link"), h("h3", {}, r.from + " → " + r.to));
  box.append(...field("Send only when", textInput(r.condition || "", (v) => { r.condition = v.trim() || undefined; changed(); draw(); }, { placeholder: "always", spellcheck: "false" }),
    "an expression over earlier outputs, such as len(" + r.from + ".output) > 200 or " + r.from + ".ok"));
  box.append(h("div", { class: "row small muted" }, ["output", "ok", "tokens", "took_ms", "tok_per_sec"].map((f) => h("button", { class: "btn", type: "button", style: { margin: "4px 4px 0 0", padding: "2px 7px" }, onclick: () => {
    r.condition = (r.condition && r.condition !== "always" ? r.condition + " && " : "") + r.from + "." + f; changed(); draw(); inspect();
  } }, r.from + "." + f))));
  const ta = h("textarea", { rows: 6, spellcheck: "false", placeholder: "Reshape the payload. Go template, e.g. Summarise: {{ .%s.output }}".replace("%s", r.from) });
  ta.value = r.transform || "";
  ta.addEventListener("input", () => { r.transform = ta.value || undefined; changed(); draw(); });
  box.append(...field("Reshape what is sent", ta, "empty passes " + r.from + "'s output through unchanged"));
  box.append(h("div", { style: { marginTop: "18px" } }, h("button", { class: "btn danger", type: "button", onclick: () => deleteEdge(i) }, "Delete link")));
}

// ---------- edits ----------
function uniqueName(base) { let n = base, i = 2; while (S.spec.agents[n]) n = base + i++; return n; }

// A name whose unit folder is also unused, so a new agent never takes over (and
// resets) the unit of one that was deleted earlier.
async function freeName() {
  const tried = new Set();
  for (let i = 0; i < 200; i++) {
    let name = "agent", k = 2;
    while (S.spec.agents[name] || tried.has(name)) name = "agent" + k++;
    tried.add(name);
    try { if (!(await api("GET", "/api/unit?agent=" + name)).exists) return name; } catch { return name; }
  }
  throw new Error("too many agents");
}
async function addAgent(x, y) {
  let name;
  try { name = await freeName(); } catch (e) { $("save").textContent = e.message; return; }
  S.spec.agents[name] = { unit: "./agents/" + name };
  // Step aside from any agent already there, so a new one is never hidden under another.
  const taken = (px, py) => Object.values(S.layout).some((p) => Math.abs(p.x - px) < 40 && Math.abs(p.y - py) < 40);
  x = Math.round(x); y = Math.round(y);
  while (taken(x, y)) { x += 40; y += 40; }
  S.layout[name] = { x, y };
  try { S.units[name] = await api("PUT", "/api/unit?agent=" + name, { prompt: "" }); } catch (e) { $("save").textContent = "Not saved: " + e.message; }
  layoutChanged(); changed(); draw(); select({ kind: "agent", name });
}
async function createOwnUnit(name) {
  const a = S.spec.agents[name];
  try { S.units[name] = await api("PUT", "/api/unit?agent=" + name, { prompt: "", model: a.model || "" }); a.unit = "./agents/" + name; delete a.model; } catch (e) { $("save").textContent = e.message; return; }
  changed(); draw(); inspect();
}
function renameAgent(old, next) {
  if (next === old) return;
  if (!NAME_RE.test(next) || S.spec.agents[next]) { $("save").textContent = !NAME_RE.test(next) ? "Names use letters, digits and underscores" : "That name is taken"; return inspect(); }
  const agents = {};
  for (const [k, v] of Object.entries(S.spec.agents)) agents[k === old ? next : k] = v;
  S.spec.agents = agents;
  S.spec.routing.forEach((r) => { if (r.from === old) r.from = next; if (r.to === old) r.to = next; });
  for (const v of Object.values(agents)) if (v.depends_on) v.depends_on = v.depends_on.map((d) => (d === old ? next : d));
  S.layout[next] = S.layout[old]; delete S.layout[old];
  layoutChanged(); changed(); draw(); select({ kind: "agent", name: next });
}
function deleteAgent(name) {
  delete S.spec.agents[name]; delete S.layout[name];
  S.spec.routing = S.spec.routing.filter((r) => r.from !== name && r.to !== name);
  for (const v of Object.values(S.spec.agents)) if (v.depends_on) { v.depends_on = v.depends_on.filter((d) => d !== name); if (!v.depends_on.length) delete v.depends_on; }
  layoutChanged(); changed(); select(null); draw();
}
function deleteEdge(i) { S.spec.routing.splice(i, 1); changed(); select(null); draw(); }
function addEdge(from, to) {
  if (from === to || S.spec.routing.some((r) => r.from === from && r.to === to)) return;
  S.spec.routing.push({ from, to });
  changed(); draw(); select({ kind: "edge", i: S.spec.routing.length - 1 });
}

async function assignModel(agent, m) {
  const a = S.spec.agents[agent], dir = ownDir(agent);
  if (m.error) return;
  const ctx = Math.min(m.context_length || 4096, 4096);
  if (dir && S.units[dir]?.editable !== false) {
    try { S.units[dir] = await api("PUT", "/api/unit?agent=" + dir, { model: m.ref, context: S.units[dir]?.context || ctx }); delete a.model; }
    catch (e) { $("save").textContent = "Not saved: " + e.message; return; }
  } else a.model = m.ref;
  changed(); draw(); if (S.sel?.name === agent) inspect();
}

// ---------- models panel ----------
const VERDICT = { fits: ["ok", "fits"], tight: ["warn", "tight"], too_large: ["bad", "too large"], unknown: ["", "fit unknown"] };
function bestFit(m) {
  const rank = { too_large: 0, unknown: 1, tight: 2, fits: 3 };
  return (m.fit || []).reduce((best, f) => (!best || rank[f.verdict] > rank[best.verdict] ? f : best), null);
}
let modelFilter = "";
function renderModels() {
  const box = $("models");
  box.replaceChildren();
  box.append(h("h2", {}, "Your models"));
  if (S.hw) {
    const gpus = S.hw.devices.filter((d) => d.class === "gpu").map((d) => d.name + (d.memory_mb ? " " + Math.round(d.memory_mb / 1024) + " GB" : ""));
    box.append(h("div", { class: "hw" }, Math.round(S.hw.total_ram_mb / 1024) + " GB memory · " + S.hw.cpu_cores + " cores · " + (gpus.length ? gpus.join(", ") : "no GPU detected")));
  }
  box.append(textInput(modelFilter, (v) => { modelFilter = v.toLowerCase(); renderModelList(); }, { placeholder: "Filter models" }));
  box.append(h("div", { id: "modelList", style: { marginTop: "10px" } }));
  box.append(h("h2", { style: { marginTop: "18px" } }, "Folders searched"));
  const dirs = h("div", { class: "small" });
  S.fixedDirs.forEach((d) => dirs.append(h("div", { class: "mono muted" }, d)));
  S.dirs.forEach((d) => dirs.append(h("div", { class: "row" }, h("span", { class: "mono", style: { flex: 1, wordBreak: "break-all" } }, d), h("button", { class: "btn", type: "button", onclick: () => saveDirs(S.dirs.filter((x) => x !== d)) }, "×"))));
  if (!S.fixedDirs.length && !S.dirs.length) dirs.append(h("div", { class: "muted" }, "Ollama and models NexusRun downloaded. Add a folder of .gguf files to see more."));
  box.append(dirs);
  const add = textInput("", () => {}, { placeholder: "/path/to/models" });
  box.append(h("div", { class: "row", style: { marginTop: "8px", gap: "6px" } }, h("div", { style: { flex: 1 } }, add), h("button", { class: "btn", type: "button", onclick: () => { if (add.value.trim()) saveDirs([...S.dirs, add.value.trim()]); } }, "Add")));
  renderModelList();
}
function renderModelList() {
  const list = $("modelList");
  if (!list) return;
  list.replaceChildren();
  const shown = S.models.filter((m) => !modelFilter || (m.ref + " " + (m.name || "")).toLowerCase().includes(modelFilter));
  if (!shown.length) list.append(h("div", { class: "muted small" }, S.models.length ? "No match." : "No models found yet."));
  for (const m of shown) {
    const fit = bestFit(m), v = fit ? VERDICT[fit.verdict] : null;
    const meta = h("div", { class: "meta" });
    if (m.error) meta.append(h("span", { class: "pill bad", title: m.error }, "unreadable"));
    else {
      [m.parameters, m.quantization, (m.size_bytes / 1073741824).toFixed(1) + " GB"].filter(Boolean).forEach((t) => meta.append(h("span", { class: "pill" }, t)));
      if (v) meta.append(h("span", { class: "pill " + v[0], title: "estimated memory " + Math.round(fit.need_mb / 1024 * 10) / 10 + " GB on " + fit.device }, fit.device + ": " + v[1]));
      if (!m.chat) meta.append(h("span", { class: "pill warn", title: "No chat template in the file; it may not follow chat instructions" }, "no chat template"));
      if (m.moe) meta.append(h("span", { class: "pill" }, "MoE"));
    }
    const el = h("div", { class: "model" + (m.error ? " err" : ""), title: m.path }, h("div", { class: "name" }, m.ref), meta);
    if (!m.error) {
      el.addEventListener("pointerdown", (e) => startDrag(e, { type: "model", model: m }, m.name || m.ref));
    }
    list.append(el);
  }
}
async function refreshModels() {
  try {
    const r = await api("GET", "/api/models");
    S.models = r.models; S.hw = r.hardware;
  } catch (e) { S.models = []; }
  renderModels();
}
async function saveDirs(dirs) {
  try { const r = await api("PUT", "/api/settings", { model_dirs: dirs }); S.dirs = r.model_dirs; $("save").textContent = ""; await refreshModels(); }
  catch (e) { $("save").textContent = e.message; }
}

// ---------- pointer interaction ----------
const svg = $("svg");
function world(ev) {
  const r = svg.getBoundingClientRect();
  return { x: (ev.clientX - r.left - S.view.x) / S.view.k, y: (ev.clientY - r.top - S.view.y) / S.view.k };
}
function overStage(ev) { const r = $("stage").getBoundingClientRect(); return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom; }

// A drag that starts in a palette item and ends on the canvas.
function startDrag(ev, payload, label) {
  if (ev.button !== 0) return;
  const ghost = $("ghost");
  ghost.textContent = label; ghost.hidden = false;
  let moved = false;
  const place = (e) => { ghost.style.left = e.clientX + 12 + "px"; ghost.style.top = e.clientY + 12 + "px"; };
  place(ev);
  const move = (e) => { moved = true; place(e); };
  const up = (e) => {
    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
    ghost.hidden = true;
    if (!moved || !overStage(e)) {
      if (!moved && payload.type === "model" && S.sel?.kind === "agent") assignModel(S.sel.name, payload.model); // a plain click assigns to the selected agent
      if (!moved && payload.type === "agent") addAtCentre();
      return;
    }
    const target = document.elementFromPoint(e.clientX, e.clientY)?.closest?.("[data-agent]");
    if (payload.type === "agent") { const w = world(e); addAgent(w.x - W / 2, w.y - H / 2); }
    else if (payload.type === "model" && target) { select({ kind: "agent", name: target.dataset.agent }); assignModel(target.dataset.agent, payload.model); }
  };
  window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
}

svg.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  const port = e.target.closest?.(".port"), node = e.target.closest?.("[data-agent]"), edge = e.target.closest?.("[data-edge]");
  if (port && port.dataset.port === "out") return startLink(e, node.dataset.agent);
  if (node) return startMove(e, node.dataset.agent);
  if (edge) { select({ kind: "edge", i: +edge.dataset.edge }); return; }
  startPan(e);
});

function startLink(e, from) {
  e.preventDefault();
  const tmp = $("tmp"), a = outPt(from);
  const move = (ev) => tmp.setAttribute("d", curve(a, world(ev)));
  const up = (ev) => {
    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
    tmp.setAttribute("d", "");
    const t = document.elementFromPoint(ev.clientX, ev.clientY)?.closest?.("[data-agent]");
    if (t) addEdge(from, t.dataset.agent);
  };
  window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
}
function startMove(e, name) {
  select({ kind: "agent", name });
  const start = world(e), p0 = { ...S.layout[name] };
  let moved = false;
  const move = (ev) => {
    const w = world(ev);
    if (!moved && Math.hypot(w.x - start.x, w.y - start.y) < 3) return;
    moved = true;
    S.layout[name] = { x: Math.round(p0.x + w.x - start.x), y: Math.round(p0.y + w.y - start.y) };
    draw();
  };
  const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); if (moved) layoutChanged(); };
  window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
}
function startPan(e) {
  select(null);
  svg.classList.add("panning");
  const x0 = e.clientX, y0 = e.clientY, v0 = { ...S.view };
  const move = (ev) => { S.view.x = v0.x + ev.clientX - x0; S.view.y = v0.y + ev.clientY - y0; $("vp").setAttribute("transform", `translate(${S.view.x},${S.view.y}) scale(${S.view.k})`); };
  const up = () => { svg.classList.remove("panning"); window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
  window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
}
svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = svg.getBoundingClientRect(), k = Math.min(2, Math.max(0.3, S.view.k * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
  const px = e.clientX - r.left, py = e.clientY - r.top;
  S.view.x = px - ((px - S.view.x) / S.view.k) * k; S.view.y = py - ((py - S.view.y) / S.view.k) * k; S.view.k = k;
  $("vp").setAttribute("transform", `translate(${S.view.x},${S.view.y}) scale(${S.view.k})`);
}, { passive: false });

window.addEventListener("keydown", (e) => {
  if ((e.key !== "Delete" && e.key !== "Backspace") || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
  if (S.sel?.kind === "agent") { e.preventDefault(); deleteAgent(S.sel.name); }
  else if (S.sel?.kind === "edge") { e.preventDefault(); deleteEdge(S.sel.i); }
});

function fitView() {
  const names = Object.keys(S.spec.agents);
  if (!names.length) { S.view = { x: 40, y: 40, k: 1 }; return draw(); }
  const xs = names.map((n) => S.layout[n].x), ys = names.map((n) => S.layout[n].y);
  const minX = Math.min(...xs), maxX = Math.max(...xs) + W, minY = Math.min(...ys), maxY = Math.max(...ys) + H;
  const r = svg.getBoundingClientRect(), pad = 60;
  const k = Math.min(1.2, Math.max(0.3, Math.min((r.width - pad * 2) / (maxX - minX), (r.height - pad * 2) / (maxY - minY))));
  S.view = { k, x: (r.width - (maxX - minX) * k) / 2 - minX * k, y: (r.height - (maxY - minY) * k) / 2 - minY * k };
  draw();
}

// ---------- startup ----------
$("addAgent").addEventListener("pointerdown", (e) => startDrag(e, { type: "agent" }, "＋ Agent"));
function addAtCentre() { const r = svg.getBoundingClientRect(); addAgent((r.width / 2 - S.view.x) / S.view.k - W / 2, (r.height / 2 - S.view.y) / S.view.k - H / 2); }
$("addAgent").addEventListener("click", (e) => { if (e.detail === 0) addAtCentre(); }); // keyboard activation
$("fit").addEventListener("click", fitView);
$("showYaml").addEventListener("click", () => { $("yaml").hidden = !$("yaml").hidden; renderYaml(); });
$("copyYaml").addEventListener("click", () => navigator.clipboard?.writeText(S.yaml).catch(() => {}));

function newSpec(name) {
  return { apiVersion: "nexusrun.dev/v1", kind: "Workflow", name: (name || "workflow").toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "") || "workflow", version: "0.1.0", agents: {}, routing: [] };
}

async function start() {
  if (!token) { $("health").textContent = "no access token"; $("health").className = "pill bad"; $("inspector").textContent = "Open the link that `nexus studio` printed; it carries the access token."; return; }
  let p;
  try { p = await api("GET", "/api/project"); } catch (e) { $("health").textContent = "offline"; $("health").className = "pill bad"; $("inspector").textContent = e.message; return; }
  S.project = p; S.layout = p.layout || {}; S.dirs = p.model_dirs || []; S.fixedDirs = p.fixed_dirs || [];
  $("dir").textContent = p.dir; $("dir").title = p.dir;
  if (p.exists) {
    const rep = await api("POST", "/api/parse", { yaml: p.yaml });
    S.diags = rep.diagnostics;
    if (!rep.spec) {
      // Not readable as a workflow: show why, and leave the file alone.
      S.broken = true; S.spec = newSpec(p.name); S.yaml = p.yaml;
      $("stage").append(h("div", { id: "banner" }, "nexus-compose.yaml cannot be read, so Studio will not change it. Fix it in your editor (see the problems below), then reload."));
    } else { S.spec = rep.spec; S.yaml = p.yaml; }
  } else { S.spec = newSpec(p.name); }
  S.spec.agents = S.spec.agents || {}; S.spec.routing = S.spec.routing || [];
  for (const n of Object.keys(S.spec.agents)) { const d = ownDir(n); if (d) await loadUnit(d); }
  autoPlace(); draw(); renderProblems(); renderYaml(); inspect();
  if (Object.keys(S.spec.agents).length) fitView();
  await refreshModels();
}
start();
</script>
</body>
