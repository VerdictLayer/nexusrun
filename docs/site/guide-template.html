  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} · NexusRun</title>
  <meta name="description" content="Set up a small local AI helper with Ollama and NexusRun, then prepare it for offline use. Step-by-step instructions and complete YAML.">
  <meta name="color-scheme" content="dark light">
  <link rel="canonical" href="https://nexusrun.dev/{{SLUG}}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --bg:#12161a; --panel:#191e23; --ink:#e4e9ed; --muted:#a8b1b9; --rule:#343d46; --accent:#ff8b59; }
    @media(prefers-color-scheme:light) { :root { color-scheme:light; --bg:#f6f7f8; --panel:#fff; --ink:#14191e; --muted:#515d68; --rule:#d1d8de; --accent:#b83b09; } }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.75 system-ui,-apple-system,"Segoe UI",sans-serif; }
    a { color:var(--accent); text-underline-offset:3px; overflow-wrap:anywhere; }
    a:hover { text-decoration-thickness:2px; }
    a:focus-visible,button:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
    header { border-bottom:1px solid var(--rule); }
    nav { max-width:1140px; margin:auto; padding:20px 24px; display:flex; align-items:center; gap:12px 24px; flex-wrap:wrap; }
    nav a { color:var(--ink); text-decoration:none; font-size:15px; }
    nav .brand { margin-right:auto; font-size:21px; font-weight:750; letter-spacing:-.7px; }
    nav .brand span { color:var(--accent); }
    .layout { max-width:1140px; margin:48px auto 80px; padding:0 24px; display:grid; grid-template-columns:220px minmax(0,1fr); gap:56px; }
    aside { font-size:14px; align-self:start; position:sticky; top:24px; }
    aside p { color:var(--muted); margin:0 0 12px; }
    aside ul { padding-left:16px; }
    aside li { margin:9px 0; }
    aside a { color:var(--muted); }
    main { min-width:0; max-width:760px; }
    h1 { font-size:clamp(2rem,4.5vw,3rem); line-height:1.12; letter-spacing:-1.2px; margin:0 0 28px; }
    h2 { font-size:1.65rem; line-height:1.3; margin:52px 0 18px; padding-top:18px; border-top:1px solid var(--rule); }
    h3 { font-size:1.2rem; margin-top:32px; }
    h1,h2,h3 { scroll-margin-top:24px; }
    p { margin:0 0 20px; }
    li { margin-bottom:8px; }
    code { font-family:ui-monospace,"Cascadia Mono",Consolas,monospace; font-size:.86em; overflow-wrap:anywhere; }
    :not(pre)>code { background:var(--panel); border:1px solid var(--rule); border-radius:4px; padding:1px 4px; }
    .code-block { margin:24px 0; border:1px solid var(--rule); border-radius:8px; background:var(--panel); overflow:hidden; }
    .code-toolbar { padding:6px 12px; border-bottom:1px solid var(--rule); display:flex; justify-content:flex-end; }
    button { font:inherit; font-size:13px; color:var(--ink); background:var(--bg); border:1px solid var(--rule); border-radius:5px; padding:4px 12px; cursor:pointer; }
    pre { margin:24px 0; padding:18px; overflow:auto; background:var(--panel); border:1px solid var(--rule); border-radius:8px; line-height:1.6; }
    .code-block pre { margin:0; border:0; border-radius:0; }
    pre code { overflow-wrap:normal; white-space:pre; }
    .table-scroll { overflow-x:auto; margin:24px 0; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th,td { text-align:left; vertical-align:top; border:1px solid var(--rule); padding:12px; min-width:140px; }
    th { background:var(--panel); }
    footer { border-top:1px solid var(--rule); padding-top:24px; margin-top:52px; font-size:14px; color:var(--muted); }
    .skip { position:absolute; left:16px; top:-100px; padding:10px; background:var(--panel); }
    .skip:focus { top:8px; }
    @media(max-width:800px) { .layout { grid-template-columns:minmax(0,1fr); gap:28px; margin-top:32px; } aside { position:static; border-bottom:1px solid var(--rule); padding-bottom:12px; } aside .toc>ul { columns:2; column-gap:24px; } aside .toc li { break-inside:avoid; } }
    @media(max-width:480px) { body { font-size:16px; } nav,.layout { padding-left:18px; padding-right:18px; } nav { gap:12px 18px; } nav .brand { width:100%; } aside .toc>ul { columns:1; } }

  <script>
    document.querySelectorAll('pre').forEach(function(pre) {
      var code = pre.querySelector('code');
      if (!code) return;
      var wrapper = document.createElement('div');
      wrapper.className = 'code-block';
      var bar = document.createElement('div');
      bar.className = 'code-toolbar';
      var button = document.createElement('button');
      button.type = 'button';
      button.textContent = 'Copy';
      button.setAttribute('aria-label', code.classList.contains('language-yaml') ? 'Copy YAML configuration' : 'Copy commands');
      button.setAttribute('aria-live', 'polite');
      button.addEventListener('click', async function() {
        try { await navigator.clipboard.writeText(code.textContent); button.textContent = 'Copied'; }
        catch (e) { button.textContent = 'Select text to copy'; }
        setTimeout(function() { button.textContent = 'Copy'; }, 2500);
      });
      pre.parentNode.insertBefore(wrapper,pre);
      bar.appendChild(button); wrapper.appendChild(bar); wrapper.appendChild(pre);
    });
    document.querySelectorAll('table').forEach(function(table) {
      var wrapper = document.createElement('div');
      wrapper.className = 'table-scroll'; wrapper.tabIndex = 0;
      wrapper.setAttribute('role','region'); wrapper.setAttribute('aria-label','Scrollable reference table');
      table.parentNode.insertBefore(wrapper,table); wrapper.appendChild(table);
    });
  </script>
