apiVersion: nexusrun.dev/v1
name: fleet-demo
version: 0.1.0
description: Small chat agent with acceptance tests for fleet releases
license: Apache-2.0
models:
  - id: main
    source: ollama:qwen2.5:0.5b
    context: 2048
    temperature: 0
entrypoint:
  type: chat
  system_prompt: Follow the user's instructions. Keep answers brief.
hardware:
  prefer: [cpu]
installation:
  targets:
    - os: linux
      arch: amd64
      device: cpu
